name: pr-sync-net-schema-skip.yml
on:
  pull_request:
    types: [ synchronize ]
    paths-ignore:
      - pandapower/network_schema/**

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      network_schema: ${{ steps.filter.outputs.network_schema }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            network_schema:
              - 'pandapower/network_schema/**'

  # This test is a filler so required will be successful even if the tests are skipped.
  network_schema:
    needs: changes
    if: needs.changes.outputs.network_schema == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        #python-version: ['3.11', '3.14']
        # Reminder: when removing the support of an old python version here, then don't forget to
        # remove it also in pyproject.toml 'requires-python' and the release pipelines
        group: [ 1, 2, 3, 4 ]
    steps:
#      - uses: julia-actions/setup-julia # Update version when using this by adding commit sha!
      - run: 'echo "test not required"'
