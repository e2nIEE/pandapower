# Pull request pipeline.
#
# The job definitions live in tiered-tests.yml so that pull requests and tag
# releases are gated on exactly the same checks. See that file for the tiers:
#   T1 static checks -> T2 fast tests -> T3 full matrix -> T4 advisory
#
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: pandapower
on:
  pull_request:
    paths-ignore:
      - 'CHANGELOG.rst'
      - '**/CHANGELOG.rst'

permissions:
  contents: read

# https://stackoverflow.com/questions/66335225/how-to-cancel-previous-runs-in-the-pr-when-you-push-new-commitsupdate-the-curre
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/tiered-tests.yml
    with:
      run_tier3: true
      run_tier4: true
      # skip network_schema on sync (see pr-sync-net-schema workflow)
      run_network_schema: ${{ github.event.action != 'synchronize' }}
      collect_coverage: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
