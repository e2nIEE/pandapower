# Tiered test pipeline.
#
# A reusable workflow that runs the test suite in escalating tiers. Each tier is
# gated on the one before it, so a cheap failure (formatting, typing, an import
# error) is reported in a couple of minutes instead of after the full matrix has
# burned through runner minutes.
#
#   Tier 1  ~2-5 min   static checks: ruff format, mypy, package build/import
#   Tier 2  ~5-10 min  fast unit tests, single python, no slow markers
#   Tier 3  ~20-40 min full matrix: all pythons, network_schema, numpy1, opf,
#                      warnings-as-errors, relying packages, postgresql, docs
#   Tier 4             advisory only, never blocks: flake8, tutorials
#
# Called by pr-open-all.yml (pull requests) and release.yml (tag releases).

name: tiered-tests

on:
  workflow_call:
    inputs:
      run_tier3:
        description: 'Run the tier 3 full matrix'
        required: false
        default: true
        type: boolean
      run_tier4:
        description: 'Run the tier 4 advisory checks'
        required: false
        default: true
        type: boolean
      run_network_schema:
        description: 'Run the network_schema tests (skipped on PR sync, see pr-sync-net-schema.yml)'
        required: false
        default: true
        type: boolean
      collect_coverage:
        description: 'Collect and upload coverage reports'
        required: false
        default: true
        type: boolean
    secrets:
      CODECOV_TOKEN:
        required: false
      CODACY_PROJECT_TOKEN:
        required: false

permissions:
  contents: read

env:
  IGNORES: "--ignore=test/opf --ignore=test/network_schema"
  TUTORIAL_IGNORES: "--ignore=tutorials/uk_power_networks"

jobs:

  # =========================================================================
  # TIER 1 - static checks. Seconds to a few minutes, no test execution.
  # =========================================================================

  format:
    name: 'T1: ruff format'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: 'pyproject.toml'
      - name: Install ruff
        run: uv tool install ruff
      - name: Ruff Format Check
        run: uv tool run ruff format --check
      # Advisory: ruff check is not yet clean on this codebase, so it reports
      # into the log without failing the tier. Promote to a hard gate by
      # dropping continue-on-error once the backlog is cleared.
      - name: Ruff Check (advisory)
        continue-on-error: true
        run: uv tool run ruff check

  typing:
    name: 'T1: mypy'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        python-version: ['3.14']
        # Reminder: when removing the support of an old python version here, then don't forget to
        # remove it also in pyproject.toml 'requires-python'
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: 'pyproject.toml'
      - name: Install dependencies
        run: |
          uv sync --all-extras
      - name: Check types with mypy
        run: |
          uv run mypy

  package:
    name: 'T1: build and import'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: 'pyproject.toml'
      - name: Build sdist and wheel
        run: uv build
      - name: Check distribution metadata
        run: uv tool run twine check --strict dist/*
      # Catches a broken __init__, a missing package-data entry or a bad
      # dependency pin without installing the full dev extra.
      - name: Import from the built wheel
        run: |
          uv venv .venv-smoke
          uv pip install --python .venv-smoke dist/*.whl
          uv run --python .venv-smoke --no-project python -c "import pandapower; print(pandapower.__version__)"

  # =========================================================================
  # TIER 2 - fast unit tests. One python version, slow tests deselected.
  # Gated on tier 1.
  # =========================================================================

  fast-tests:
    name: 'T2: fast tests'
    needs: [ format, typing, package ]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: 'pyproject.toml'
      - name: Install dependencies
        run: |
          uv sync --extra all --extra test --extra pgm
          uv pip uninstall juliacall
      - name: List of installed packages
        run: uv pip list
      - name: Test with pytest (fast tests only)
        run: |
          uv run pytest -m "not slow" $IGNORES

  # =========================================================================
  # TIER 3 - full matrix. Gated on tier 2.
  # =========================================================================

  build:
    name: 'T3: tests'
    needs: fast-tests
    if: ${{ inputs.run_tier3 }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.11', '3.12', '3.13', '3.14' ]
        # Reminder: when removing the support of an old python version here, then don't forget to
        # remove it also in pyproject.toml 'requires-python' and the release pipelines
        group: [ 1, 2 ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Install dependencies
        if: ${{matrix.python-version != '3.11'}}
        run: |
          uv sync --extra all --extra test --extra pandamodels --extra pgm
          uv pip install pytest-split
          uv pip uninstall juliacall
      - name: Install dependencies # Test without pgm
        if: ${{matrix.python-version == '3.11'}}
        run: |
          uv sync --extra all --extra test --extra pandamodels
          uv pip install pytest-split
          uv pip uninstall juliacall
      - name: List of installed packages
        run: |
          uv pip list
      - name: Test with pytest
        if: ${{ matrix.python-version != '3.12' || !inputs.collect_coverage }}
        run: |
          uv run pytest --splits 2 --group ${{ matrix.group }} $IGNORES
      - name: Test with pytest, Codecov and Coverage
        if: ${{ matrix.python-version == '3.12' && inputs.collect_coverage }} # collecting on 3.12 (oldest version where pgm is included)
        run: |
          uv pip install pytest-cov numpy~=1.26
          uv run pytest --cov=./ --cov-report=xml --splits 2 --group ${{ matrix.group }} $IGNORES
          cp ./coverage.xml ./coverage-${{ matrix.group }}.xml
      - name: Upload coverage as artifact
        if: ${{ matrix.python-version == '3.12' && inputs.collect_coverage }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.group }}
          path: ./coverage-${{ matrix.group }}.xml

  network_schema:
    name: 'T3: network_schema'
    # This tests only the network_schema tests due to the large amount these are only tested on min/max python version
    needs: fast-tests
    if: ${{ inputs.run_tier3 && inputs.run_network_schema }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        #python-version: ['3.11', '3.14']
        # Reminder: when removing the support of an old python version here, then don't forget to
        # remove it also in pyproject.toml 'requires-python' and the release pipelines
        group: [ 1, 2, 3, 4 ]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          #python-version: ${{ matrix.python-version }}
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Install dependencies
        run: |
          uv sync --extra all --extra test --extra pandamodels --extra pgm
          uv pip uninstall juliacall
          uv pip install pytest-cov pytest-split
      - name: List of installed packages
        run: |
          uv pip list
      - name: Test with pytest, Codecov and Coverage
        run: |
          uv run pytest --cov=./ --cov-report=xml --splits 4 --group ${{ matrix.group }} test/network_schema
          cp ./coverage.xml ./coverage-net-schema-${{ matrix.group }}.xml
      - name: Upload coverage as artifact
        if: ${{ inputs.collect_coverage }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-net-schema-${{ matrix.group }}
          path: ./coverage-net-schema-${{ matrix.group }}.xml

  numpy1-support:
    name: 'T3: numpy 1.x'
    needs: fast-tests
    if: ${{ inputs.run_tier3 }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Install dependencies
        run: |
          uv sync --extra dev
          uv pip install pytest-split
          uv pip install numpy~=1.26
          uv pip uninstall juliacall
      - name: List of installed packages
        run: |
          uv pip list
      - name: Test with pytest
        run: |
          uv run pytest --splits 2 --group ${{ matrix.group }} $IGNORES

  opf:
    name: 'T3: opf'
    needs: fast-tests
    if: ${{ inputs.run_tier3 }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    strategy:
      matrix:
        python-version: ['3.14']
        julia-version: [ '1.12' ]
        # Reminder: when removing the support of an old python version here, then don't forget to
        # remove it also in pyproject.toml 'requires-python'
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Install dependencies
        run: |
          uv sync --extra pandamodels --extra test
          uv pip install pytest-cov pytest-split
      - name: Setup Julia
        uses: julia-actions/setup-julia@5c9647d97b78a5debe5164e9eec09d653d29bd71 #v2
        with:
          version: ${{ matrix.julia-version }}
          arch: 'x64'
      - name: List of installed packages
        run: |
          uv pip list
          julia -e 'using Pkg; Pkg.status()'
      - name: Test with pytest, Codecov and Coverage
        run: |
          uv run pytest --cov=./ --cov-report=xml test/opf
          cp ./coverage.xml ./coverage-opf.xml
      - name: Upload coverage as artifact
        if: ${{ inputs.collect_coverage }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-opf
          path: ./coverage-opf.xml

  warnings:
    name: 'T3: warnings as errors'
    # make pytest raise warnings as errors to see if there are warnings
    needs: fast-tests
    if: ${{ inputs.run_tier3 }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.14']
        group: [ 1, 2, 3, 4 ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Install dependencies
        run: |
          uv sync --extra dev
          uv pip install pytest-split
          if [ -f requirements.txt ]; then uv pip install -r requirements.txt; fi
      - name: List of installed packages
        run: |
          uv pip list
      - name: Test with pytest
        run: |
          uv run pytest -W error --splits 2 --group ${{ matrix.group }}

  relying:
    name: 'T3: relying packages'
    # packages that rely on pandapower
    needs: fast-tests
    if: ${{ inputs.run_tier3 }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.11', '3.12', '3.13', '3.14' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Install dependencies
        run: |
          uv sync --extra test
          uv pip install setuptools
          uv pip install matplotlib
          uv pip install lxml
          if ${{ matrix.python-version != '3.11' }}; then uv pip install numba; fi
      - name: Install pandapipes and simbench
        run: |
          uv pip install git+https://github.com/e2nIEE/pandapipes@develop#egg=pandapipes
          uv pip install git+https://github.com/e2nIEE/simbench@develop#egg=simbench
      - name: List of installed packages
        run: |
          uv pip list
      - name: Test pandapipes
        run: |
          uv run python -c 'from pandapipes import pp_dir; import pytest; import sys; ec = pytest.main([pp_dir]); sys.exit(ec)'
      - name: Test simbench
        run: |
          uv run python -c 'from simbench import sb_dir; import pytest; import sys; ec = pytest.main([sb_dir]); sys.exit(ec)'

  postgresql:
    name: 'T3: postgresql'
    # for the one test to cover postgresql
    needs: fast-tests
    if: ${{ inputs.run_tier3 }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: sandbox
        ports:
          - 5432:5432
          - 55432:5432 # custom port to test against.
        options: >-
          --name postgres
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      matrix:
        python-version: ['3.14']
    steps:
      - name: Wait for PostgreSQL database to be ready
        run: |
          until pg_isready -h localhost -U test_user; do
            echo "Waiting for Postgres…"
            sleep 2
          done
      - name: Check psql and service version compatibility
        run: |
          SERVER_VERSION=$(docker exec postgres psql -U test_user -d sandbox -tA -c "SHOW server_version;")
          CLIENT_VERSION=$(psql --version | awk '{print $3}')
          SERVER_MAJOR=${SERVER_VERSION%%.*}
          CLIENT_MAJOR=${CLIENT_VERSION%%.*}
          echo "PostgreSQL Server Version: $SERVER_MAJOR - Client Version: $CLIENT_MAJOR"
          if [ "$SERVER_MAJOR" != "$CLIENT_MAJOR" ]; then
            echo "::error::psql version mismatch - server=$SERVER_MAJOR vs client=$CLIENT_MAJOR"
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Install dependencies
        run: |
          uv sync --extra test --extra fileio
      - name: List of installed packages
        run: |
          uv pip list
      - name: Test postgresql available
        # Test that will fail the pipeline if the tests would be skipped. Prevents pipeline success if psycopg import fails
        env:
          DSN: 'postgresql://test_user:secret@localhost:55432/sandbox'
          SCHEMA: 'test_schema'
        run: |
          uv run python -c "import sys; from test.api.test_sql_io import POSTGRESQL_AVAILABLE; sys.exit(not POSTGRESQL_AVAILABLE);"
      - name: Test pandapower File I/O
        env:
          DSN: 'postgresql://test_user:secret@localhost/sandbox'
          SCHEMA: 'test_schema'
        run: |
          uv run pytest test/api/test_sql_io.py
      - name: Test pandapower File I/O against alternative port
        env:
          DSN: 'postgresql://test_user:secret@localhost:55432/sandbox'
          SCHEMA: 'test_schema'
        run: |
          uv run pytest test/api/test_sql_io.py

  docs_check:
    name: 'T3: Sphinx docs check'
    needs: fast-tests
    if: ${{ inputs.run_tier3 }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Check sphinx build
        uses: ammaraskar/sphinx-action@54e52bfb642e9b60ea5b6bcb05fe3f74b40d290a #8.2.3
        with:
          pre-build-command: "python -m pip install uv && uv pip install .[docs] --system --link-mode=copy"
          build-command: "sphinx-build -b html . _build -W"
          docs-folder: "doc/"

  upload-coverage:
    name: 'T3: upload coverage'
    needs: [ build, opf ]
    if: ${{ always() && inputs.run_tier3 && inputs.collect_coverage && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: .
          pattern: coverage-*
          merge-multiple: true
      - name: Generate coverage file list
        id: coverage-files
        run: |
          FILES=$(find . -name "coverage-*.xml" | tr '\n' ',' | sed 's/,$//')
          echo "files=$FILES" >> $GITHUB_OUTPUT
      - name: duplicate reports
        shell: bash
        run: |
          for f in coverage-*.xml; do
            cp "$f" "codacy-$f"
          done
      - name: Upload coverage to Codacy
        continue-on-error: true
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 #v1.3
        with:
          coverage-reports: codacy-coverage-*.xml
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
      - name: Upload coverage to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 #v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage-files.outputs.files }}
          verbose: true

  # =========================================================================
  # TIER 4 - advisory. Reports into the log, never blocks a merge or release.
  # =========================================================================

  linting:
    name: 'T4: flake8 (advisory)'
    # run flake8 and check for errors
    needs: fast-tests
    if: ${{ inputs.run_tier4 }}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.11' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Install dependencies
        run: |
          uv sync
          uv pip install flake8 matplotlib
      - name: List of installed packages
        run: |
          uv pip list
      - name: Lint with flake8 (syntax errors and undefined names)
        continue-on-error: true
        run: |
          # stop the build if there are Python syntax errors or undefined names (omitted by exit-zero)
          uv run flake8 . --exclude .venv --count --exit-zero --select=E9,F63,F7,F82 --show-source --statistics
      - name: Lint with flake8 (all errors and warnings)
        run: |
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          uv run flake8 . --exclude .venv --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  tutorial_tests:
    name: 'T4: tutorials'
    needs: fast-tests
    if: ${{ inputs.run_tier4 }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [ 1, 2, 3 ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Install dependencies
        run: |
          uv sync --extra all --extra tutorials --extra test --extra pgm
      - name: List all installed packages
        run: |
          uv pip list
      - name: Test with pytest
        # Careful when copying this command. The PYTHONPATH setup is Linux specific syntax.
        run: |
          uv run pytest -W error --splits 3 --group ${{ matrix.group }} --nbmake --nbmake-timeout=900 --timeout=900 "./tutorials" $TUTORIAL_IGNORES
