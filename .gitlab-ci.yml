stages:
  - test

default:
  image: python:3.11-slim
  tags:
    - intranet
    - kassel

test:
  before_script:
    - pip install -r requirements.txt
    - python3 --version
    - pip list

  stage: test
  rules:
    - if: '$CI_COMMIT_BRANCH == "sce"'
  script:
    - pytest pandapower/test/shortcircuit/sce_tests/sample_tests