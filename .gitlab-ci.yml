stages:
  - test

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"

default:
  image: python:3.11-slim
  tags:
    - sce
  before_script:
    - python -V
    - pip install --no-cache-dir uv
    - uv venv
    - . .venv/bin/activate
  cache:
    key: "${CI_JOB_NAME}-${CI_COMMIT_REF_SLUG}"
    paths:
      - .venv/
      - .uv-cache/

pytest:
  stage: test
  timeout: 360m
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.11"]
  image: python:${PYTHON_VERSION}-slim
  script:
    - uv sync --extra test
    - |
      if [ -f requirements.txt ]; then uv pip install -r requirements.txt; fi
      uv pip install pytest-split numba openpyxl pyproj matplotlib
    - uv pip list
    - |
      uv run pytest pandapower/test/shortcircuit/sce_tests/test_sce.py
        -n=auto
  rules:
    - if: '$CI_COMMIT_BRANCH == "sce"'