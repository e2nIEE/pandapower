stages:
  - test
  - docs

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"

default:
  image: python:3.11-slim
  before_script:
    - python -V
    - pip install --no-cache-dir uv
    - uv venv
    - . .venv/bin/activate
  cache:
    key: "${CI_JOB_NAME}-${CI_COMMIT_REF_SLUG}"
    paths:
      - .venv/
      - .uv-cache/

workflow:
  rules:
    - changes:
        - CHANGELOG.rst
      when: never
    - when: always

# -----------------------------
# pytest (all tests except PostgreSQL)
# -----------------------------
pytest:
  stage: test
  timeout: 60m
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.11", "3.12"]
        GROUP: [1, 2]
  image: python:${PYTHON_VERSION}-slim
  script:
    - uv sync --all-extras
    - |
      if [ -f requirements.txt ]; then uv pip install -r requirements.txt; fi
      uv pip install pytest-split numba
    - uv pip list
    - |
      uv run pytest \
        -n=auto \
        -m "not postgresql" \
        --splits 2 \
        --group ${GROUP}

# -----------------------------
# docs check
# -----------------------------
docs_check:
  stage: docs
  image: python:3.11-slim
  script:
    - uv sync --all-extras
    - uv run sphinx-build -b html doc/ doc/_build -W
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - doc/_build